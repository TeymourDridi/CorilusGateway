spring.main.web-application-type=reactive
#server.port=8888
spring.application.name=gateway-service

#spring.cloud.discovery.enabled=true
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

server.port=${PORT:80}
spring.cloud.gateway.discovery.locator.enabled=true
eureka.instance.prefer-ip-address=false
eureka.instance.instance-id=${spring.application.name}
eureka.instance.hostname=corilusgateway.azurewebsites.net
eureka.instance.non-secure-port=${PORT:80}
eureka.client.serviceUrl.defaultZone=https://coriluseurekaserver.azurewebsites.net/eureka

spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin,RETAIN_UNIQUE
spring.cloud.gateway.default-filters[1]=DedupeResponseHeader=Access-Control-Allow-Credentials,RETAIN_UNIQUE
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
spring.cloud.gateway.routes[0].id=AUTH-SERVICE
spring.cloud.gateway.routes[0].uri=lb://auth-service
#spring.cloud.gateway.routes[0].uri=http://localhost:8081/
spring.cloud.gateway.routes[0].predicates[0]=Path=Method=*
spring.cloud.gateway.routes[0].metadata[websocket]=true

spring.cloud.gateway.routes[1].id=INVOICE-SERVICE
spring.cloud.gateway.routes[1].uri=lb://invoice-service
#spring.cloud.gateway.routes[1].uri=http://localhost:8082/
spring.cloud.gateway.routes[1].predicates[0]=Path=Method=*

