#server.port=8888
spring.application.name=gateway-service
spring.cloud.gateway.discovery.locator.enabled=true
#spring.cloud.discovery.enabled=true
#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true
eureka.client.serviceUrl.defaultZone=https://coriluseurekaserver.azurewebsites.net/eureka
spring.cloud.gateway.routes[0].id=AUTH-SERVICE
spring.cloud.gateway.routes[0].uri=https://corilusauthentification.azurewebsites.net/
#spring.cloud.gateway.routes[0].uri=http://localhost:8080/
spring.cloud.gateway.routes[0].predicates[0]=Path=

spring.cloud.gateway.routes[1].id=INVOICE-SERVICE
spring.cloud.gateway.routes[1].uri=https://springdeployement.azurewebsites.net/
#spring.cloud.gateway.routes[1].uri=http://localhost:8081/
spring.cloud.gateway.routes[1].predicates[0]=Path=

